<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Eclipse - Offline</title>
  <style>
    :root {
      --bg-primary: #141414;
      --bg-surface: #1e1e1e;
      --brand-primary: #d97757;
      --text-primary: #f5f4ef;
      --text-secondary: #a1a1aa;
      --border-subtle: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .offline-logo {
      width: 58px;
      height: 58px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .retry-btn {
      margin-top: 10px;
      background: var(--brand-primary);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14.5px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .retry-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/static/logo.svg" alt="Eclipse" class="offline-logo" />
    <h1>Gateway Offline</h1>
    <p>Cannot reach the Eclipse server. Ensure your host machine or Termux daemon is running and your device is on the same network.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      Retry Connection
    </button>
  </div>
</body>
</html>
